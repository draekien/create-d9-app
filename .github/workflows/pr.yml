name: PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!.changeset/**'
              - '!.draekien/**'
              - '!LICENSE'

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  release-note:
    name: release note
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: git fetch origin main:refs/remotes/origin/main
      - run: pnpm exec changeset status --since=origin/main
      - run: git diff --name-only --diff-filter=A origin/main...HEAD -- '.changeset/*.md' | grep .

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [changes, lint, test, release-note]
    if: always()
    env:
      CODE: ${{ needs.changes.outputs.code }}
      CHANGES: ${{ needs.changes.result }}
      LINT: ${{ needs.lint.result }}
      TEST: ${{ needs.test.result }}
      RELEASE_NOTE: ${{ needs.release-note.result }}
    steps:
      - run: |
          test "$CHANGES" = success || exit 1
          test "$RELEASE_NOTE" = success || exit 1
          test "$CODE" = false && exit 0
          test "$LINT" = success -a "$TEST" = success
